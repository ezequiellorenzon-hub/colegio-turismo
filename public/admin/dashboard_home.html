<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CPTBA</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        body {
            /* Eliminamos el fondo gradiente para que se vea bien dentro del dashboard gris */
            background: #f5f7fa; 
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .dashboard-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); /* Sombra más suave para el interior */
            width: 90%;
            max-width: 800px;
            padding: 60px 40px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            color: #1e293b;
            margin: 0;
            font-weight: 700;
        }

        .subtitle {
            color: #64748b;
            margin-top: 15px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    
    <main class="dashboard-container">
        <h1>Sistema de Gestión CPTBA</h1>
        <p class="subtitle">Panel de administración centralizado</p>
    </main>

    </body>
</html>
