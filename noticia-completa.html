<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:type" content="article">
    <meta property="og:url" content="">
    <meta property="og:image" content="/assets/images/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <title id="page-title">Noticia - Colegio de Turismo</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .article-header {
            margin-bottom: 30px;
        }
        .article-image {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .article-meta {
            display: flex;
            gap: 20px;
            color: var(--gray);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .article-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .article-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #333;
        }
        .article-content p {
            margin-bottom: 20px;
        }
        .back-button {
            margin-bottom: 30px;
        }
        .featured-badge {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        /* GALERÍA */
        .gallery-container {
            margin: 40px 0;
            padding: 30px;
            background: #f8fafc;
            border-radius: 12px;
        }

        .gallery-container h3 {
            margin-bottom: 20px;
            color: #1e293b;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .gallery-grid img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .gallery-grid img:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* LIGHTBOX */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
        }

        .lightbox-close:hover {
            color: #ccc;
        }
    </style>
</head>
<body>
    
    <div id="navbar-placeholder"></div>

    <section class="section">
        <div class="container">
            <div class="back-button">
                <a href="/noticias.html" class="btn btn-secondary">← Volver a Noticias</a>
            </div>

            <div id="article-container" style="max-width: 900px; margin: 0 auto;">
                <div class="loading" style="text-align: center; padding: 50px;">Cargando noticia...</div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('active');
        }

        async function loadArticle() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const id = urlParams.get('id');
                
                if (!id) {
                    window.location.href = '/noticias.html';
                    return;
                }
                
                const response = await fetch(`/api/news/${id}`);
                
                if (!response.ok) {
                    throw new Error('Noticia no encontrada');
                }
                
                const article = await response.json();
                
                document.getElementById('page-title').textContent = `${article.title} - Colegio de Turismo`;
                
                function setMeta(name, content, isProperty = false) {
                    if (!content) return;
                    let selector = isProperty ? `meta[property="${name}"]` : `meta[name="${name}"]`;
                    let el = document.head.querySelector(selector);
                    if (!el) {
                        el = document.createElement('meta');
                        if (isProperty) el.setAttribute('property', name);
                        else el.setAttribute('name', name);
                        document.head.appendChild(el);
                    }
                    el.setAttribute('content', content);
                }

                setMeta('description', article.excerpt || article.title);
                setMeta('og:title', article.title, true);
                setMeta('og:description', article.excerpt || article.title, true);
                setMeta('og:image', article.image_url || '/assets/images/og-image.jpg', true);
                setMeta('og:url', window.location.href, true);
                document.title = `${article.title} - Colegio de Turismo`;
                
                const container = document.getElementById('article-container');
                container.innerHTML = `
                    <article>
                        <div class="article-header">
                            ${article.featured ? '<span class="featured-badge">⭐ Noticia Destacada</span>' : ''}
                            <h1 style="margin-bottom: 15px; font-size: 2.5rem; line-height: 1.2;">${escapeHtml(article.title)}</h1>
                            <div class="article-meta">
                                <span>👤 ${escapeHtml(article.author)}</span>
                                <span>📅 ${formatDate(article.created_at)}</span>
                                ${article.updated_at !== article.created_at ? 
                                    `<span>✏️ Actualizado: ${formatDate(article.updated_at)}</span>` : ''}
                            </div>
                        </div>
                        
                        ${article.image_url ? 
                            `<img src="/assets/media_upload/${article.image_url}" 
                                  alt="${escapeHtml(article.title)}" 
                                  class="article-image"
                                  onerror="this.src='/assets/images/placeholder.jpg';">` 
                            : ''}
                        
                        ${article.excerpt ? 
                            `<div style="background: var(--light-gray); padding: 20px; border-left: 4px solid var(--primary); margin-bottom: 30px; border-radius: 5px;">
                                <strong style="font-size: 1.2rem;">${escapeHtml(article.excerpt)}</strong>
                            </div>` : ''}
                        
                        <div class="article-content">
                            ${formatContent(article.content)}
                        </div>
                        
                        ${renderGallery(article.gallery)}
                        
                        <div style="margin-top: 50px; padding-top: 30px; border-top: 2px solid var(--light-gray); text-align: center;">
                            <a href="/noticias.html" class="btn btn-primary">← Volver a todas las noticias</a>
                        </div>
                    </article>
                `;
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('article-container').innerHTML = `
                    <div style="text-align: center; padding: 50px;">
                        <h2 style="color: #991b1b;">⚠️ Noticia no encontrada</h2>
                        <p style="margin: 20px 0;">Lo sentimos, no pudimos encontrar esta noticia.</p>
                        <a href="/noticias.html" class="btn btn-primary">Ver todas las noticias</a>
                    </div>
                `;
            }
        }

        function renderGallery(gallery) {
            if (!gallery || gallery.length === 0) return '';
            
            return `
                <div class="gallery-container">
                    <h3>📸 Galería de Imágenes</h3>
                    <div class="gallery-grid">
                        ${gallery.map(img => `
                            <img src="/assets/media_upload/${img.image_filename}" 
                                 alt="Imagen de galería"
                                 onclick="openLightbox('/assets/media_upload/${img.image_filename}')"
                                 onerror="this.style.display='none'">
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openLightbox(imageSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = imageSrc;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('es-ES', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatContent(content) {
            if (!content) return '';
            
            const paragraphs = content.split('\n\n').filter(p => p.trim());
            
            return paragraphs.map(p => {
                if (p.trim().startsWith('- ') || p.trim().startsWith('* ')) {
                    const items = p.split('\n').filter(item => item.trim());
                    return '<ul style="margin: 20px 0; margin-left: 30px;">' + 
                           items.map(item => `<li style="margin-bottom: 10px;">${escapeHtml(item.replace(/^[-*]\s*/, ''))}</li>`).join('') + 
                           '</ul>';
                }
                return `<p>${escapeHtml(p)}</p>`;
            }).join('');
        }

        loadArticle();

        fetch('/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
            })
            .catch(err => console.error('Error cargando navbar:', err));

        fetch('/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(err => console.error('Error cargando footer:', err));
    </script>
</body>
</html>
